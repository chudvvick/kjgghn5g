<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183f35">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giriş">
<title>Giriş</title>
<style>
:root{--bg:#f5f4ef;--paper:#fffefa;--ink:#20372e;--muted:#647168;--line:#cbd5c3;--brand:#183f35;--on-brand:#ffffff;--lime:#dcf2a0;--accent:#a34d26;--error:#a3261f}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--paper:#19231e;--ink:#e4ece2;--muted:#9aa99e;--line:#3a4b40;--brand:#24594a;--on-brand:#ffffff;--lime:#d4ef93;--accent:#e08a5e;--error:#f08a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;display:grid;place-items:center;min-height:100vh;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:28px 24px}
.mark{width:44px;height:44px;border-radius:14px;background:var(--brand);color:var(--lime);display:grid;place-items:center;margin-bottom:18px}
.mark svg{width:28px;height:28px}
h1{font-size:24px;letter-spacing:-.6px;margin:0 0 6px}
.lead{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
#password{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.remember{display:flex;gap:9px;align-items:center;font-weight:500;margin:14px 0 18px}
.remember input{width:20px;height:20px;margin:0;accent-color:var(--brand)}
button{width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:var(--brand);color:var(--on-brand);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.error{color:var(--error);font-size:13px;min-height:20px;margin:12px 0 0}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="16" height="12" rx="3"/><path d="M11 14v-3a5 5 0 0 1 10 0v3"/></svg></div>
  <h1>Giriş</h1>
  <p class="lead">Devam etmek için şifreni gir.</p>
  <form id="unlock">
    <label for="password">Şifre</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Bu cihazda hatırla</label>
    <button id="submit" type="submit">Aç</button>
    <p id="error" class="error" role="alert"></p>
  </form>
  <noscript><p class="error">Bu sayfa JavaScript açık bir tarayıcı ister.</p></noscript>
</main>

const KEY_STORAGE='unlock-key';
const card=document.getElementById('card'),form=document.getElementById('unlock'),button=document.getElementById('submit'),error=document.getElementById('error');
function fromB64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function toB64(bytes){let s='';bytes.forEach(function(b){s+=String.fromCharCode(b);});return btoa(s);}
function readSavedKey(){try{return localStorage.getItem(KEY_STORAGE);}catch(e){return null;}}
function saveKey(raw){try{localStorage.setItem(KEY_STORAGE,raw);}catch(e){}}
function forgetKey(){try{localStorage.removeItem(KEY_STORAGE);}catch(e){}}
async function deriveKey(password){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(PAYLOAD.salt),iterations:PAYLOAD.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decrypt(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(PAYLOAD.iv)},key,fromB64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close();}
function resetButton(){button.disabled=false;button.textContent='Aç';}
async function tryStoredKey(){
  const saved=readSavedKey();
  if(!saved)return;
  card.hidden=true;
  try{
    const key=await crypto.subtle.importKey('raw',fromB64(saved),{name:'AES-GCM'},false,['decrypt']);
    show(await decrypt(key));
  }catch(e){
    forgetKey();
    card.hidden=false;
  }
}
form.addEventListener('submit',async function(event){
  event.preventDefault();
  button.disabled=true;button.textContent='Açılıyor…';error.textContent='';
  let key,html;
  try{
    key=await deriveKey(document.getElementById('password').value);
    html=await decrypt(key);
  }catch(e){
    error.textContent=e&&e.name==='OperationError'?'Şifre yanlış. Tekrar dene.':'Bu tarayıcı sayfayı açamadı. Safari’yi güncelleyip tekrar dene.';
    resetButton();
    return;
  }
  if(document.getElementById('remember').checked){
    try{saveKey(toB64(new Uint8Array(await crypto.subtle.exportKey('raw',key))));}catch(e){}
  }
  show(html);
});
if(!PAYLOAD||!window.crypto||!crypto.subtle){
  error.textContent='Bu tarayıcı şifreli sayfayı açamıyor. Sayfayı https bağlantısıyla, güncel Safari’de aç.';
  button.disabled=true;
}else{
  tryStoredKey();
